name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # actionlint and GitHub's macOS image are not pinned, so a change in either
  # -- osascript's behaviour among them -- surfaces as a failing job. That only
  # holds if something runs when nobody has pushed.
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; reference project pin
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; reference project pin
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global "$(node --print 'require("./package.json").packageManager')"
      - run: npm ci --ignore-scripts
      # Verification, not build-first: committed dist must already match src.
      - run: npm run quality
      - run: npm run package
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-evidence
          path: |
            reports/
            artifacts/
          if-no-files-found: error
          retention-days: 14

  macos-integration:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: brew install actionlint
      - run: npm install --global "$(node --print 'require("./package.json").packageManager')"
      - run: npm ci --ignore-scripts
      - run: npm run quality
      - run: npm run test:integration:macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-macos-evidence
          path: reports/native-macos.json
          if-no-files-found: error
          retention-days: 14
