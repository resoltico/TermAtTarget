name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Check the current advisory database and hosted macOS image weekly.
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; reference project pin
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; reference project pin
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global "$(node --print 'require("./package.json").packageManager')"
      - id: restore
        run: npm ci --ignore-scripts
      - run: bash tools/install-actionlint.sh
      - run: npm run quality
      - run: npm run package
      - name: Audit the full dependency lockfile
        if: >-
          !cancelled() && steps.restore.outcome == 'success' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p reports
          npm audit --audit --json > reports/npm-audit.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-evidence
          path: |
            reports/
            artifacts/
          if-no-files-found: error
          retention-days: 14

  macos-integration:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global "$(node --print 'require("./package.json").packageManager')"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:integration:macos
      - run: node tools/verify-native.mjs reports/native-macos.json dist/Term-At-Target.jxa "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-macos-evidence
          path: reports/native-macos.json
          if-no-files-found: error
          retention-days: 14
