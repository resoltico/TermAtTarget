name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: brew install actionlint
      - run: npm ci --ignore-scripts
      - run: node tools/release-notes.mjs "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
      - run: npm run quality
      - run: npm run test:integration:macos
      # A rebuild follows, never precedes, committed-dist verification.
      - run: npm run build
      - run: git diff --exit-code -- dist/
      - run: npm run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-release
          path: |
            dist/
            INSTALL.txt
            artifacts/
            reports/native-macos.json
          if-no-files-found: error

  publish:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-release
          path: release-files
      - name: Verify downloaded bytes
        run: |
          (cd release-files/dist && sha256sum --check SHA256SUMS)
          (cd release-files/artifacts && sha256sum --check -- ./*.sha256)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-files/dist/*
            release-files/INSTALL.txt
            release-files/artifacts/*
            release-files/reports/native-macos.json
      - name: Verify attestations and the tag target
        run: |
          for subject in release-files/dist/* release-files/INSTALL.txt release-files/artifacts/* release-files/reports/native-macos.json; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY"
          done
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          test "$current" = "$GITHUB_SHA"
      - name: Extract notes from the tagged CHANGELOG and publish
        run: |
          node tools/release-notes.mjs "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" \
            release-files/dist/Term-At-Target.jxa \
            release-files/dist/SHA256SUMS \
            release-files/INSTALL.txt \
            release-files/artifacts/*.tar.gz \
            release-files/artifacts/*.sha256 \
            release-files/reports/native-macos.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Term At Target ${RELEASE_TAG#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
